{% extends "base/base.html" %}

{% block content %}

<div class="gt-recipe-shell">
    <div class="gt-recipe-card gt-delete-card">

        <div class="gt-recipe-header">

            <h1>Delete Recipe</h1>

            <p>
                Are you sure you want to delete this recipe?
                This action cannot be undone.
            </p>

        </div>

        <div class="gt-recipe-name">
            {{ object.title }}
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="gt-actions">

                <button
                    type="submit"
                    class="gt-btn-delete"
                >
                    Yes, Delete Recipe
                </button>

                <a
                    href="{% url 'common:home' %}"
                    class="gt-cancel-link"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>
</div>

{% endblock %}
