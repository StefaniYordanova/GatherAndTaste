<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Gather & Taste - Discover recipes, share your creations and connect through food.">

    <title>{% block title %}Gather & Taste{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap"
          rel="stylesheet">

    {% load static %}

    <link rel="stylesheet" href="{% static 'css/gather_and_taste_styles.css' %}">

    {% block extra_css %}{% endblock %}

</head>

<body>

    {% include 'base/nav.html' %}

    <main class="main-content">

        <!-- Django Messages -->
        {% if messages %}
            <div class="container mt-3">

                {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show"
                         role="alert">

                        {{ message }}

                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="alert"
                                aria-label="Close">
                        </button>

                    </div>
                {% endfor %}

            </div>
        {% endif %}

        {% block content %}
        {% endblock %}

    </main>

    {% include 'base/footer.html' %}


</body>
</html>
