{% extends 'base/base.html' %}

{% block title %}Password Updated | Gather&Taste{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card text-center">

        <div class="rounded-circle d-inline-flex align-items-center justify-content-center mx-auto mb-3 fw-bold fs-4"
             style="width: 64px; height: 64px; background-color: var(--color-background); color: var(--color-primary); border: 1px solid var(--color-border);">
            &#10003;
        </div>

        <div class="auth-header mb-4">

            <h1>Password Updated</h1>

            <p>
                Your password has been changed successfully. You are still signed in to your account.
            </p>

        </div>

        <div class="d-flex flex-column gap-2">
            <a href="{% url 'accounts:personal-info' %}" class="btn btn-brand w-100">
                Back to Personal Info
            </a>

            <a href="{% url 'common:home' %}" class="btn btn-outline-brand w-100">
                Go to Home Page
            </a>
        </div>

    </div>

</section>

{% endblock %}
